<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Emulador EscBematech — Histórico</title>
  <link id="favicon" rel="icon" type="image/svg+xml" />
  <script>
    // Aplicado antes do CSS para a página não abrir piscando no tema errado.
    const systemDark = matchMedia('(prefers-color-scheme: dark)');

    function savedTheme() {
      try {
        return localStorage.getItem('theme');
      } catch {
        return null;
      }
    }

    function applyTheme() {
      document.documentElement.dataset.theme = savedTheme() || (systemDark.matches ? 'dark' : 'light');
    }

    applyTheme();
  </script>
  <link rel="stylesheet" href="/style.css" />
  <header>
    <button id="theme" type="button">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
      </svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
    </button>
    <h1>Emulador EscBematech</h1>
    <p>48 colunas · Histórico de impressões</p>
    <div id="status">Conectando…</div>
  </header>
  <main>
    <aside>
      <h2 id="count">Histórico</h2>
      <input id="search" type="search" placeholder="Buscar por número ou texto" aria-label="Buscar impressões" />
      <label class="follow">
        <input id="follow" type="checkbox" />
        Mostrar novas impressões automaticamente
      </label>
      <div id="list"></div>
      <button id="clear" disabled>Limpar histórico</button>
    </aside>
    <section class="viewer">
      <div class="toolbar">
        <h2 id="title"></h2>
        <div class="actions">
          <button id="image" class="link" type="button" hidden>Baixar imagem</button>
          <a id="download" hidden>Baixar comandos brutos</a>
        </div>
      </div>
      <div id="meta"></div>
      <div id="events" hidden></div>
      <div class="paper-scroll" id="paper-scroll" hidden><div id="paper"></div></div>
      <div id="warnings"></div>
    </section>
  </main>
  <footer>
    Emulador EscBematech {{VERSION}} · desenvolvido por
    <a href="https://github.com/robatistello" target="_blank" rel="noopener">Rodrigo Batistello</a>
  </footer>
  <script src="/qrcode.js"></script>
  <script src="/paper.js"></script>
  <script src="/app.js"></script>
</html>
