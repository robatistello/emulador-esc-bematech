name: Comando não suportado
description: O histórico mostra um aviso de comando não suportado ou não renderizado.
labels: [comando]
body:
  - type: markdown
    attributes:
      value: |
        Novos comandos entram conforme aparecem nos testes. Com os bytes originais dá para implementar e testar o comando
        exatamente como o seu sistema envia.

  - type: input
    id: warning
    attributes:
      label: Aviso mostrado
      description: O texto que aparece abaixo da impressão no histórico.
      placeholder: Comando ESC 63 não suportado.
    validations:
      required: true

  - type: textarea
    id: raw
    attributes:
      label: Bytes da impressão
      description: |
        No histórico, abra a impressão e clique em **Baixar comandos brutos**. O GitHub não aceita arquivos `.bin`:
        compacte o arquivo em `.zip` e arraste o zip para cá. Confira antes se a impressão não tem dados pessoais.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
      description: O que o comando faz na impressora real, como uma imagem, um código de barras ou uma mudança de fonte.
