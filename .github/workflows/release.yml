name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Conferir versão
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath emulator/server.py -Pattern '^VERSION = "(.+)"$').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "A tag $env:GITHUB_REF_NAME não corresponde a VERSION = $version no emulator/server.py."
          }

      - name: Testes
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_paper.cjs

      - name: Build
        shell: pwsh
        run: .\packaging\build.ps1 -Python python

      - name: Testar o executável
        run: python tools/smoke_test.py outputs/windows/EmuladorEscBematech.exe

      - name: Compactar
        shell: pwsh
        run: |
          $zip = "EmuladorEscBematech-$($env:GITHUB_REF_NAME.TrimStart('v'))-windows.zip"
          Compress-Archive -Path outputs/windows/EmuladorEscBematech.exe, outputs/windows/LEIA-ME.txt -DestinationPath $zip

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: EmuladorEscBematech-*-windows.zip
          if-no-files-found: error
          retention-days: 1

  linux:
    runs-on: ubuntu-24.04
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Testes
        run: |
          uv run --no-project --managed-python --python 3.14 python -m unittest discover -s tests -v
          node tests/test_paper.cjs

      - name: Build
        run: bash packaging/build.sh

      - name: Testar o executável
        run: python3 tools/smoke_test.py outputs/linux/EmuladorEscBematech

      - name: Compactar
        run: |
          name="EmuladorEscBematech-${GITHUB_REF_NAME#v}-linux"
          cp -r outputs/linux "$name"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: EmuladorEscBematech-*-linux.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          EmuladorEscBematech-*-windows.zip EmuladorEscBematech-*-linux.tar.gz
          --repo "$GITHUB_REPOSITORY"
          --title "Emulador EscBematech $GITHUB_REF_NAME"
          --generate-notes
