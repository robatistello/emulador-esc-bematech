name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Testes (${{ matrix.os }}, Python 3.14)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Testes Python
        run: python -m unittest discover -s tests -v

      - name: Testes do renderizador
        run: node tests/test_paper.cjs

  lint:
    name: Formatação e análise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Formatação do Python
        run: |
          pip install ruff==0.17.3
          ruff format --check

      - name: Formatação da página
        run: npx --yes prettier@3.9.10 --check emulator/web tests/test_paper.cjs eslint.config.mjs

      - name: Análise do JavaScript
        run: npx --yes eslint@10.13.0 emulator/web tests/test_paper.cjs
