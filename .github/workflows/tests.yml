name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Testes
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_paper.cjs

      - name: Formatação do Python
        if: runner.os == 'Linux'
        run: |
          pip install ruff==0.17.3
          ruff format --check

      - name: Formatação da página
        if: runner.os == 'Linux'
        run: npx --yes prettier@3.9.10 --check emulator/web tests/test_paper.cjs eslint.config.mjs

      - name: Análise do JavaScript
        if: runner.os == 'Linux'
        run: npx --yes eslint@10.13.0 emulator/web tests/test_paper.cjs
